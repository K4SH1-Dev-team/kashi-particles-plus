blockly.category.kashiparticles=KASHI Particles

blockly.block.world_spawn_kashi_particle=Spawn KASHI Particle %1 at x: %2 y: %3 z: %4 direction x: %5 y: %6 z: %7 scale: %8 duration: %9
blockly.block.world_spawn_kashi_particle.tooltip=Plays an imported KASHI particle effect at a world position. Direction (0, 0, 0) keeps the orientation it was authored with (up stays up) - best for area effects. A non-zero direction turns the whole effect to face that way, same idea as the "aim" field on the entity-spawn block, just given directly instead of read off an entity. Scale and duration are additive on top of what the effect authored - 0 changes nothing (Snowstorm stays the source of truth): scale grows or shrinks every particle by that much, and duration lengthens or shortens how long the emitter keeps spawning new particles (active_time), not any single particle's own lifetime. Each effect it fires is invisible beyond a normal render distance and, past a few dozen at once in the same tick, some can end up spawned but never actually drawn - fine for one target, worth pacing out (a short delay between calls, or fewer targets) for something like an AOE hitting a crowd.

blockly.block.entity_spawn_kashi_particle_from_target=Spawn KASHI Particle %1 from entity %2 offset right %3 up %4 forward %5 aim %6 scale: %7 duration: %8
blockly.block.entity_spawn_kashi_particle_from_target.tooltip=Plays an imported KASHI particle effect from the entity's feet. The offset is measured in the entity's own frame, so "forward 3" stays 3 blocks in front whether it looks up or down, and "up 0" lands on the ground rather than at eye height. Aim turns the whole effect: full look follows pitch, level turns without tilting, and no aim keeps world orientation - which is what AOE effects and emitter_transform_* effects usually want. Scale and duration are additive on top of what the effect authored - 0 changes nothing: scale grows or shrinks every particle, duration lengthens or shortens how long the emitter keeps spawning new particles (active_time), not any single particle's own lifetime. Firing many effects from many entities in the same tick (a crowd all playing a hit effect at once) can outrun a frame - pace it out if a scene calls for a lot at once.

blockly.block.block_spawn_kashi_particle_from_block=Spawn KASHI Particle %1 from block at x: %2 y: %3 z: %4 direction x: %5 y: %6 z: %7 scale: %8 duration: %9
blockly.block.block_spawn_kashi_particle_from_block.tooltip=Plays an imported KASHI particle effect at the centre of a block. Direction (0, 0, 0) keeps the orientation it was authored with (up stays up); a non-zero direction turns the whole effect to face that way, same idea as the "aim" field on the entity-spawn block. Scale and duration are additive on top of what the effect authored - 0 changes nothing: scale grows or shrinks every particle, duration lengthens or shortens how long the emitter keeps spawning new particles (active_time). Each effect it fires is invisible beyond a normal render distance and, past a few dozen at once in the same tick, some can end up spawned but never actually drawn - worth pacing out if many blocks fire together.

blockly.block.entity_attach_kashi_particle=Attach KASHI Particle %1 to entity %2 at %3 offset right %4 up %5 forward %6 aim %7 scale: %8 duration: %9
blockly.block.entity_attach_kashi_particle.tooltip=Plays an imported KASHI particle effect and keeps it following the entity every tick, position AND rotation both - an aura, fire on the feet, energy in a hand that turns with the arm - instead of spawning once at a fixed position like the other spawn blocks. Root/body, head and eye track the entity itself and are exact; the four hand/foot points are a visually-tuned approximation driven by attack/walk animation (not a real bone lookup) that still turns and swings along with the limb - a punch tips a hand-anchored effect forward, a stride swings a foot-anchored one - and falls back to root/body for anything that is not a living, biped-shaped entity. Offset and aim work exactly like the entity-spawn block, measured from the chosen point rather than always the feet ("up 0" lands right on that point). Rotation follows the full look direction - pitch included, not just turning side to side - so an offset on a head/eye anchor swings up and down as the entity looks up and down, not just side to side. Like every KASHI spawn this is fire-and-forget: an attached looping effect still ends on its own after at most 30 seconds of following, even though it kept tracking the entity right up until then - there is no way yet to attach one that runs until something else ends it.

blockly.block.stop_kashi_particle=Stop KASHI Particle %1 on entity %2
blockly.block.stop_kashi_particle.tooltip=Ends every currently-running instance of an imported KASHI particle effect that was started directly by a Spawn or Attach block - world, entity, block, and attach spawns all stop the same way. This only stops the emitter from spawning any more particles - everything it already spawned keeps fading out on its own, the same as if the effect had simply run its course; see "Despawn KASHI Particle" instead for an instant, total cutoff that also clears every particle already on screen. Leave "on entity" unconnected to stop every instance of the effect that was NOT started from an entity (a world or block spawn) - that targets every matching instance in the dimension at once, not just one, so a Stop with no entity connected stops every world/block spawn of that effect currently running, wherever they are. Connect an entity to stop only the instances that entity itself started (an entity spawn, or an attach). An effect fired as another effect's own chained event (its Bedrock file spawning a second effect on impact, for example) is not reachable by this block - only an effect a Spawn/Attach block started directly can be stopped, the same one selected in "%1" here.

blockly.block.despawn_kashi_particle=Despawn KASHI Particle %1 on entity %2
blockly.block.despawn_kashi_particle.tooltip=Like "Stop KASHI Particle", but a full, instant cutoff instead of letting things wind down: ends the emitter AND immediately removes every particle it already spawned, so the effect disappears completely the moment this runs rather than fading out. Targeting works exactly the same as Stop - leave "on entity" unconnected to despawn every instance of the effect that was NOT started from an entity (a world or block spawn), or connect an entity to despawn only the instances that entity itself started (an entity spawn, or an attach). Also the same as Stop, an effect fired as another effect's own chained event is not reachable by this block - only an effect a Spawn/Attach block started directly can be despawned.
