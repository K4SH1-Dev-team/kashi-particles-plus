blockly.block.world_spawn_kashi_particle=Spawn KASHI Particle %1 at x: %2 y: %3 z: %4
blockly.block.world_spawn_kashi_particle.tooltip=Plays an imported KASHI particle effect at a world position, in the orientation it was authored with (up stays up). Best for area effects. Each effect it fires is invisible beyond a normal render distance and, past a few dozen at once in the same tick, some can end up spawned but never actually drawn - fine for one target, worth pacing out (a short delay between calls, or fewer targets) for something like an AOE hitting a crowd.

blockly.block.entity_spawn_kashi_particle_from_target=Spawn KASHI Particle %1 from entity %2 offset right %3 up %4 forward %5 aim %6
blockly.block.entity_spawn_kashi_particle_from_target.tooltip=Plays an imported KASHI particle effect from the entity's eyes. The offset is measured in the entity's own frame, so "forward 3" stays 3 blocks in front whether it looks up or down. Aim turns the whole effect: full look follows pitch, level turns without tilting, and no aim keeps world orientation - which is what AOE effects and emitter_transform_* effects usually want. Firing many effects from many entities in the same tick (a crowd all playing a hit effect at once) can outrun a frame - pace it out if a scene calls for a lot at once.

blockly.block.block_spawn_kashi_particle_from_block=Spawn KASHI Particle %1 from block at x: %2 y: %3 z: %4
blockly.block.block_spawn_kashi_particle_from_block.tooltip=Plays an imported KASHI particle effect at the centre of a block, in the orientation it was authored with (up stays up). Each effect it fires is invisible beyond a normal render distance and, past a few dozen at once in the same tick, some can end up spawned but never actually drawn - worth pacing out if many blocks fire together.
